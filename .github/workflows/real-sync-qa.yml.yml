name: RealSync QA Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  playwright-tests:
    name: Run Playwright E2E Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./RealSync-QA-Platform/Sut

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'npm'
          cache-dependency-path: ./RealSync-QA-Platform/Sut/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers (with OS dependencies)
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ./RealSync-QA-Platform/Sut/playwright-report/
          retention-days: 30
