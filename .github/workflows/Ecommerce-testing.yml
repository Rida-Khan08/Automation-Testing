name: E-Commerce Platform Tests

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ecommerce-tests:
    name: Run E-Commerce Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./Playwright-e2e-suite-master

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./Playwright-e2e-suite-master/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecommerce-report
          path: ./Playwright-e2e-suite-master/playwright-report/
          retention-days: 30
